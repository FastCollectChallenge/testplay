
<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Collect Challenge</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;900&family=Press+Start+2P&family=Source+Sans+3:wght@600&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Press Start 2P', cursive !important; font-synthesis: none; }
        /* Le panneau des spawns garde la police normale */
        #spawn-panel, #spawn-panel * { font-family: 'Nunito', sans-serif !important; }
        body { margin: 0; overflow: hidden; background-color: #000; font-weight: 500; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #score, #timer-display { position: absolute; color: white; font-size: 16px; font-weight: 900; z-index: 10; text-shadow: 2px 2px 4px black; display: none; }
        #score { left: 20px; top: 20px; }
        #timer-display { right: 20px; top: 20px; }
        
        #adventure-hud { position: absolute; left: 20px; top: 20px; display: none; z-index: 10; }
        .hud-row { display: flex; align-items: center; gap: 15px; }
        #open-inv-btn { background: #487eb0; color: white; border: 3px solid #fff; font-size: 10px; padding: 12px 20px; border-radius: 12px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: transform 0.2s, background 0.2s; font-weight: 700; }
        #open-inv-btn:hover { transform: scale(1.05); background: #00a8ff; }
        
        /* Cadre d'argent cliquable et extensible */
        .pinned-money { background: #f1c40f; color: #2c3e50; font-weight: 700; font-size: 12px; padding: 10px 22px; border-radius: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #fff; cursor: pointer; transition: transform 0.2s, width 0.2s, background-color 0.2s; min-width: 80px; text-align: center; }
        .pinned-money:hover { transform: scale(1.08); background-color: #e1b12c; }

        /* Styles des écrans d'interfaces overlays (Inventory & Shop) */
        #inventory-screen, #shop-screen, #index-screen { position: fixed; top: 5vh; left: 5vw; width: 90vw; height: 90vh; background: rgba(0, 0, 0, 0.55); z-index: 1000; border-radius: 25px; border: 3px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px); display: none; flex-direction: column; padding: 30px; box-sizing: border-box; color: white; }
        .screen-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .money-badge { background: #f1c40f; color: #2c3e50; font-weight: 700; font-size: 14px; padding: 10px 30px; border-radius: 50px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .close-screen-btn { background: #c23616; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 10px; }
        .close-screen-btn:hover { background: #ea2027; }

        /* Onglets pour l'inventaire */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 10px; transition: background 0.2s; }
        .tab-btn.active { background: #487eb0; border-color: #fff; }

        #inventory-grid, #shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; overflow-y: auto; flex-grow: 1; padding-right: 10px; align-content: start; }
        #index-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; overflow-y: auto; flex-grow: 1; padding-right: 10px; align-content: start; }
        .index-item-card { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .index-item-img { width: 100%; max-width: 110px; aspect-ratio: 1 / 1; object-fit: contain; }
        .index-item-img.locked { filter: brightness(0); opacity: 0.85; }
        .index-item-name { font-size: 12px; font-weight: 700; text-align: center; color: #f5f6fa; }
        
        /* Cartes d'items */
        .inv-item-card { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.15); border-radius: 25px; height: 90px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; position: relative; overflow: hidden; transition: background 0.2s, border-color 0.2s; cursor: pointer; }
        .inv-item-card:hover { background: rgba(255, 255, 255, 0.18); border-color: rgba(255,255,255,0.4); }
        .inv-item-info { display: flex; align-items: center; gap: 15px; font-size: 14px; font-weight: 700; }
        .inv-item-icon-img { width: 45px; height: 45px; object-fit: contain; }
        .inv-item-count { font-size: 14px; color: #f5f6fa; }
        
        .sell-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%) scale(0); background: #c23616; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; box-shadow: 0 3px 8px rgba(0,0,0,0.3); z-index: 5; }
        .inv-item-card:hover .sell-btn { transform: translateY(-50%) scale(1); }
        .sell-btn:hover { background: #ea2027; transform: translateY(-50%) scale(1.1) !important; }

        /* Cartes de la boutique (Shop Cards) */
        .shop-item-card { background: linear-gradient(135deg, #1e272e, #2f3640); border: 3px solid #487eb0; border-radius: 20px; height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; transition: border-color 0.2s; cursor: pointer; padding: 10px; box-sizing: border-box; }
        .shop-item-card:hover { border-color: #00a8ff; }
        .shop-item-visual { display: flex; flex-direction: column; align-items: center; justify-content: center; transition: filter 0.2s, opacity 0.2s; width: 100%; height: 100%; }
        .shop-item-img { width: 65px; height: 65px; object-fit: contain; margin-bottom: 5px; }
        .shop-item-duration { font-size: 10px; font-weight: 700; color: #dcdde1; }
        .shop-item-title { font-size: 11px; font-weight: 900; color: #fff; margin-bottom: 2px; }
        
        /* Overlay du prix au survol du Shop */
        .shop-item-price-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.2s; font-size: 12px; font-weight: 900; color: #f1c40f; pointer-events: none; }
        .shop-item-card:hover .shop-item-visual { filter: blur(3px); opacity: 0.3; }
        .shop-item-card:hover .shop-item-price-overlay { opacity: 1; }

        /* Boite de dialogue customisée modale type Confirmation */
        #custom-confirm-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.4); z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .confirm-box { background: #2f3640; border: 3px solid #487eb0; padding: 25px; border-radius: 20px; text-align: center; color: white; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .confirm-msg { font-size: 11px; font-weight: 700; margin-bottom: 20px; line-height: 1.8; }
        .confirm-actions { display: flex; justify-content: center; gap: 15px; }
        .confirm-btn { padding: 10px 25px; border-radius: 8px; border: none; font-weight: 700; font-size: 10px; cursor: pointer; transition: background 0.2s; }
        .confirm-btn.yes { background: #487eb0; color: white; }
        .confirm-btn.yes:hover { background: #00a8ff; }
        .confirm-btn.no { background: #c23616; color: white; }
        .confirm-btn.no:hover { background: #ea2027; }
